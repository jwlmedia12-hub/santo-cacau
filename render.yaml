# Hospedagem no Render (https://render.com) — "New > Blueprint" e escolha este repositório.
# Publica o servidor (API + site) em um só endereço, com HTTPS, no plano gratuito.
# O banco de dados fica no Supabase (também gratuito): veja "Banco no Supabase" no README.
services:
  - type: web
    name: santo-cacau
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --ignore-scripts
    startCommand: node server/index.js
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false # Supabase > Connect > Session pooler (troque [YOUR-PASSWORD] pela senha)
      - key: PUBLIC_URL
        sync: false # ex.: https://santo-cacau.onrender.com
      - key: MP_ACCESS_TOKEN
        sync: false # credencial do Mercado Pago (comece pela de TESTE)
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://jwlmedia12-hub.github.io
